name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # No database is reachable in this job, so the PostgreSQL tests are
      # skipped here. Running them is mandatory in the `postgres` job below.
      - run: npm test

      - run: npm run demo

      - run: npm run quickstart

      - run: npm run sdk:example

      - name: Agent demo (scripted, offline, self-checking)
        run: npm run demo:agent

      # Builds the SDK package, packs it (npm pack, nothing is published), installs
      # the tarball in a throwaway project outside the repository, type-checks and
      # runs the documented quickstart under two TypeScript module settings, and
      # checks the exports adversarially.
      - name: SDK package from a local tarball
        run: npm run sdk:package:check

      # The published proof vectors must be what the generator produces now.
      - name: Check the proof vectors are up to date
        run: npm run proof:vectors -- --check

      # Small journals, per-size time budget: fails if the replay benchmark
      # cannot run, errors, or exceeds its budget. Not a performance gate.
      - name: Replay benchmark smoke test
        run: npm run proof:bench:smoke

      - name: Check the README demo excerpt against the real demo output
        run: node scripts/check-readme-demo-excerpt.mjs

      # O1 targeted mutations: fails the job if the baseline fails, a mutant definition is broken, a mutant survives
      # (the differential tests still pass) or the script itself fails. Linux, one Node version: it is slow by design.
      - name: O1 mutation check (every mutant must be killed)
        if: ${{ matrix.node-version == 22 }}
        run: scripts/o1-mutation-check.sh

      - name: O2-1 mutation check (every mutant must be killed)
        if: ${{ matrix.node-version == 22 }}
        run: scripts/o2-mutation-check.sh

  postgres:
    name: PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: authority_graph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d authority_graph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/authority_graph_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Each file runs in its own schema (tests/storage/pgTestSchema.ts, issue #13),
      # so the files may run in parallel. The boundary test creates roles, which
      # are cluster-wide; CI connects as the container's superuser for that reason.
      - name: Run the PostgreSQL tests
        run: >-
          npx vitest run
          tests/storage/postgresEventStore.test.ts
          tests/storage/postgresCapabilityIssuanceTransaction.test.ts
          tests/storage/postgresAppendOnlyBoundary.test.ts
          tests/storage/postgresCapabilityRedemptionTransaction.test.ts
          tests/storage/postgresRedemptionProcesses.test.ts
          tests/storage/postgresRedemptionReview.test.ts
          tests/storage/postgresJournalHash.test.ts
          tests/redemption/redemptionContract.postgres.test.ts
          tests/sdk/authority.postgres.test.ts
          tests/storage/postgresTicketPerAction.test.ts
          tests/engine/o1Backends.test.ts
          tests/sdk/o2Backends.test.ts
          --reporter=default
          --reporter=json
          --outputFile.json=vitest-postgres.json

      # Vitest exits 0 when every PostgreSQL test is skipped (no reachable
      # database). This step fails the job unless all of them actually ran
      # and passed.
      - name: Check that no PostgreSQL test was skipped
        if: ${{ !cancelled() }}
        run: node scripts/check-postgres-report.mjs vitest-postgres.json

      - name: Upload the Vitest JSON report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: vitest-postgres-report
          path: vitest-postgres.json
          if-no-files-found: warn

  # Experimental example (architecture A of the OpenAI Agents SDK integration): an isolated package with its own
  # lockfile, on Node 22 only. It consumes the SDK from a locally built tarball (nothing is published), uses a scripted
  # model (no API key, no network call to OpenAI) and adds no dependency to the root package.
  openai-agents-example:
    name: OpenAI Agents SDK example (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/openai-agents/package-lock.json

      - run: npm ci

      - name: Build the SDK tarball (nothing is published)
        run: npm run sdk:package

      - name: Install the example's pinned dependencies and the SDK tarball
        run: npm ci
        working-directory: examples/openai-agents

      - run: npm run typecheck
        working-directory: examples/openai-agents

      - run: npm test
        working-directory: examples/openai-agents
